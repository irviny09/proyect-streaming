<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/semituneado.css}">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

</style>
</head>

<body>

<!-- HEADER -->
<header class="main-header">
    <div class="container text-center">
        <h5 class="fw-bold mb-0 text-dark">XXPeliculas</h5>
    </div>
</header>

<!-- CONTENIDO -->
<main class="flex-grow-1 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">

                <div class="card auth-card shadow-lg">
                    <div class="card-body p-5 text-center">

                        <h2 class="fw-bold mb-2">Crear cuenta</h2>
                        <p class="text-muted mb-4">Completa la información para registrarte</p>

                        <form>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" placeholder="Nombre">
                                        <label>Nombre</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="text" class="form-control" placeholder="Apellido">
                                        <label>Apellido</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" placeholder="Correo">
                                <label>Usuario</label>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control" placeholder="Contraseña">
                                        <label>Contraseña</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating mb-3">
                                        <input type="password" class="form-control" placeholder="Confirmar">
                                        <label>Confirmar contraseña</label>
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 mt-3">
                                Registrarse
                            </button>

                            <p class="mt-3 small">
                                ¿Ya tienes cuenta?
                                <a href="#" class="text-primary fw-medium">Inicia sesión</a>
                            </p>

                        </form>

                    </div>
                </div>

            </div>
        </div>
    </div>
</main>

<!-- FOOTER -->
<footer class="main-footer">
    © 2026 XXPELICULAS - Todos los derechos reservados
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
