<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .cascading-right {
            margin-right: -50px;
            animation: slideIn 0.9s ease;
        }

        @media (max-width: 991.98px) {
            .cascading-right {
                margin-right: 0;
            }
        }

        /* Animación de entrada */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-40px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Fade imagen */
        .login-img {
            animation: fadeIn 1.2s ease;
            transition: transform 0.6s ease;
        }

        .login-img:hover {
            transform: scale(1.03);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Card efecto suave */
        .card {
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Botón animado */
        .btn-primary {
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(13,110,253,0.3);
        }

        /* Inputs efecto focus */
        .form-control:focus {
            box-shadow: 0 0 0 0.2rem rgba(13,110,253,.25);
            border-color: #0d6efd;
        }
    </style>
</head>

<body>

<main>
<section class="text-center text-lg-start">

  <!-- Jumbotron -->
  <div class="container py-5">
    <div class="row g-0 align-items-center">

      <!-- LOGIN -->
      <div class="col-lg-6 mb-5 mb-lg-0">
        <div class="card cascading-right bg-body-tertiary" style="backdrop-filter: blur(20px);">
          <div class="card-body p-5 shadow text-center">
            <h2 class="fw-bold mb-5">Sign in</h2>

            <form>

              <!-- Email -->
              <div class="form-floating mb-4">
                <input type="email" id="email" class="form-control" placeholder="Email">
                <label for="email">Email address</label>
              </div>

              <!-- Password -->
              <div class="form-floating mb-4">
                <input type="password" id="password" class="form-control" placeholder="Password">
                <label for="password">Password</label>
              </div>

              <!-- Submit -->
              <button type="submit" class="btn btn-primary w-100 mb-4">
                Sign in
              </button>

            </form>

          </div>
        </div>
      </div>

      <!-- IMAGEN -->
      <div class="col-lg-6 mb-5 mb-lg-0">
        <img src="img/imagenFondo.png"
             class="w-100 rounded-4 shadow login-img"
             alt="Imagen Login" />
      </div>

    </div>
  </div>
  <!-- Jumbotron -->

</section>
</main>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
