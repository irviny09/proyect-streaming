>

    <div class="container text-center">
        <h5 class="fw-bold mb-0">XXPeliculas</h5>

<!-- CONTENIDO -->

                    <tr>
                        <th>Imagen</th>

                </thead>
                <tbody>

                    <tr>
                        <td>
                            <img src="img/malilla.jpg" class="movie-img" alt="malilla">

                        </td>
                        <td class="text-muted text-start">

                        </td>
                        <td>
                            <button class="btn btn-success px-4">
                                Ver Película
                            </button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <div class="text-end mt-4">
            <button class="btn btn-primary px-4">
                Salir
