<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Streaming</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/patroncito.css}">

</head>

<body>


    
<header class="main-header">
    <div class="container text-center">
        <h5 class="fw-bold mb-0">XXPeliculas</h5>
        <small class="text-muted">Cliente: No te enteres</small>
    </div>
</header>
<!-- CONTENIDO -->
<div class="container my-5">
    <div class="table-container">

        <div class="table-responsive">
            <table id="movieBody" class="table align-middle text-center">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre de la película</th>
                        <th>Descripción</th>
                        <th>Ver</th>
                    </tr>
                </thead>
                <tbody>

                    <tr>
                        <td>
                            <img th:src="@{/img/malilla.png}" class="movie-img" alt="Malilla">
                        </td>
                        <td class="fw-bold">
                            Salchichon
                        </td>
                        <td class="text-muted text-start">
                            El buen amigo mali, tine que dormir porque ya se murio de que
                            no le dan lo que pide.
                        </td>
                        <td>
                            <button class="btn btn-success px-4">
                                Ver Película
                            </button>
                        </td>
                    </tr>

                </tbody>
            </table>
        </div>

        <div class="text-end mt-4">
            <button class="btn btn-primary px-4">
                Salir
            </button>
        </div>

    </div>
</div>
<!-- FOOTER -->
<footer class="main-footer">
    © 2026 XXPELICULAS - Todos los derechos reservados
</footer>

<div class="modal fade" id="trailerModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="trailerTitle">Ver Tráiler</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0">
        <div class="ratio ratio-16x9">
            <iframe id="trailerVideo" 
                    src="" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
            </iframe>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/cliente.js}"></script>
</body>
</html>
