<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plataforma Streaming</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" th:href="@{/css/tuneado.css}">
</head>

<body>

<!-- HEADER -->
<header class="main-header">
    <div class="container text-center">
        <h5 class="fw-bold mb-0 text-dark">XXPeliculas</h5>
        <a href="/auth/logout">Salir</a>
    </div>
</header>
<!-- CONTENIDO -->
<div class="container py-5">
<div class="dashboard-wrapper">

<h2 class="mb-4">Admin </h2>

<!-- TABS -->
<ul class="nav nav-tabs mb-4">
    <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#registrar">
            Registrar nueva película
        </button>
    </li>

    <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#peliculas">
            Consultar Películas
        </button>
    </li>

    <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#clientes">
            Consultar clientes
        </button>
    </li>
</ul>

<div class="tab-content">

<!-- REGISTRAR -->
<div class="tab-pane fade show active" id="registrar">
<form class="col-md-6" method="post">

<div class="mb-3">
<label class="form-label">Nombre de la película</label>
<input id="nombre" type="text" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Genero</label>
<input id="genero" type="text" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Imagen</label>
<input id="url" type="file" class="form-control">
</div>

<div class="mb-3">
    <label class="form-label">Trailer</label>
    <input id="trailerURL" type="text" class="form-control">
</div>

<div class="mb-3">
<label class="form-label">Descripción</label>
<textarea id="descripcion" class="form-control" rows="4"></textarea>
</div>

<button type="submit" id="btnGuardar" class="btn btn-primary">Registrar</button>

</form>
</div>

<!-- CONSULTAR PELICULAS -->
<div class="tab-pane fade" id="peliculas">

<table id="tableMovies" class="table table-hover">
<thead>
<tr>
<th>IMAGEN</th>
<th>NOMBRE DE LA PELÍCULA</th>
<th>GENERO</th>
<th>DESCRIPCIÓN</th>
<th>ACCIONES</th>
</tr>
</thead>
<tbody>

</tbody>
</table>

</div>

<!-- CONSULTAR CLIENTES -->
<div class="tab-pane fade" id="clientes">

<form class="col-md-8 mb-4">

<div class="row mb-3">
<div class="col">
<label>Nombre</label>
<input id="nombre" type="text" class="form-control">
</div>
<div class="col">
<label>Clave</label>
<input disabled id="password" type="text" class="form-control" >
</div>
</div>

<div class="mb-3">
<label>Apellido Paterno</label>
<input id="apellidoP" type="text" class="form-control">
</div>

<div class="mb-3">
<label>Apellido Materno</label>
<input id="apellidoM" "text" class="form-control">
</div>

<div class="mb-3">
<label>Correo electrónico</label>
<input id="email" type="email" class="form-control">
</div>

<button type="submit" id="btnRegistrarClientes" class="btn btn-primary">Registrar</button>

</form>

<table id="tableClientes" class="table table-hover">
<thead>
<tr>
<th>Nombre completo</th>
<th>Correo / Usuario</th>
<th>Fecha de Registro</th>
<th>Acciones</th>
</tr>
</thead>
<tbody>
<tr>
<td></td>
<td></td>
<td></td>
<td>
<button class="btn btn-sm btn-danger">Eliminar</button>
<button class="btn btn-sm btn-primary">Activar</button>
</td>
</tr>
</tbody>
</table>

</div>

</div>
</div>
</div>

<!-- FOOTER -->
<footer class="main-footer">
    © 2026 XXPELICULAS - Todos los derechos reservados
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/admin.js}"></script>
</body>
</html>
